apiVersion: v1
kind: Secret
metadata:
  name: easyshop-secrets
  namespace: easyshop
type: Opaque
# Do NOT commit real secret values. Create the real secret on the cluster with:
#   kubectl -n easyshop create secret generic easyshop-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=NEXTAUTH_SECRET="$(openssl rand -base64 32)"
# If you `kubectl apply` this file afterwards, it will overwrite them with the placeholders below.
stringData:
  JWT_SECRET: "change-this-in-production"
  NEXTAUTH_SECRET: "change-this-in-production"
