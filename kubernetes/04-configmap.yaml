apiVersion: v1
kind: ConfigMap
metadata:
  name: easyshop-config
  namespace: easyshop
data:
  MONGODB_URI: "mongodb://mongodb-service:27017/easyshop"
  NODE_ENV: "production"
  # No domain yet: access the app via any EKS node public IP on NodePort 30000.
  # Replace REPLACE_WITH_NODE_PUBLIC_IP with a value from `terraform output eks_node_group_public_ips`.
  NEXT_PUBLIC_API_URL: "http://REPLACE_WITH_NODE_PUBLIC_IP:30000/api"
  NEXTAUTH_URL: "http://REPLACE_WITH_NODE_PUBLIC_IP:30000"
  # NEXTAUTH_SECRET and JWT_SECRET now live ONLY in the easyshop-secrets Secret (05-secrets.yaml).
